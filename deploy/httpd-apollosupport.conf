# Incluir desde httpd-ssl.conf: Include conf/extra/httpd-apollosupport.conf
# Requiere: mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_rewrite

<VirtualHost *:443>
    ServerName support.ultimate.net.ar
    DocumentRoot "C:/Apache24/htdocs/apollosupport"

    SSLEngine on
    SSLCertificateFile "C:/Apache24/conf/ssl/ultimate.crt"
    SSLCertificateKeyFile "C:/Apache24/conf/ssl/ultimate.key"

    <Directory "C:/Apache24/htdocs/apollosupport">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        /api/ws  ws://127.0.0.1:8001/api/ws retry=0
    ProxyPassReverse /api/ws  ws://127.0.0.1:8001/api/ws
    ProxyPass        /api     http://127.0.0.1:8001/api retry=0
    ProxyPassReverse /api     http://127.0.0.1:8001/api

    ProxyTimeout 600

    ErrorLog  "logs/apollosupport_ssl_error.log"
    CustomLog "logs/apollosupport_ssl_access.log" combined
</VirtualHost>
