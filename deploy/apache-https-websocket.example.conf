# Ejemplo de Configuración Hardened para Apache (HTTPS + WSS) en Windows.
#
# 🛡️ DISEÑADA PARA MÁXIMA RESPONSIVIDAD Y PREVENCIÓN DE ERRORES HTTP 503:
#   1. Agrega 'retry=0' para reintentar la conexión al backend instantáneamente si falla,
#      evitando el bloqueo automático de 60 segundos de Apache (AH00959 / AH01114).
#   2. Utiliza ProxyPass nativo para WebSocket (/api/ws) en lugar de RewriteRules pesados.
#   3. Añade la directiva de hilos MPM WinNT al final para soportar más de 64 agentes concurrentes.
#
# Requisitos en httpd.conf:
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#   LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
#   LoadModule ssl_module modules/mod_ssl.so
#
# Ajustar nombres, rutas de certificados y puertos según corresponda.

# =========================================================================
# CONFIGURACIÓN MPM GLOBAL (Añadir en httpd.conf si hay más de 50 dispositivos)
# =========================================================================
<IfModule mpm_winnt_module>
    ThreadLimit            2000
    ThreadsPerChild        1500
    MaxConnectionsPerChild    0
</IfModule>

<VirtualHost *:443>
    ServerName support.ultimate.net.ar
    DocumentRoot "C:/Apache24/htdocs/apollosupport"

    SSLEngine on
    SSLCertificateFile "C:/ruta/certificado.crt"
    SSLCertificateKeyFile "C:/ruta/certificado.key"
    # SSLCertificateChainFile "C:/ruta/chain.crt"   # si aplica

    <Directory "C:/Apache24/htdocs/apollosupport">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    # ── 1. WebSocket DIRECTO: Debe definirse antes del proxy HTTP genérico ──
    # Redirecciona de forma nativa todo /api/ws/ a ws://uvicorn con reintento instantáneo
    ProxyPass        /api/ws  ws://127.0.0.1:8001/api/ws retry=0
    ProxyPassReverse /api/ws  ws://127.0.0.1:8001/api/ws

    # ── 2. HTTP API: Maneja el tráfico REST estándar ──
    # 'retry=0' evita que un breve retraso en la API inhabilite todo el backend
    ProxyPass        /api  http://127.0.0.1:8001/api retry=0
    ProxyPassReverse /api  http://127.0.0.1:8001/api

    # Timeout largo para streams / WS largos (10 minutos)
    ProxyTimeout 600

    ErrorLog  "logs/apollosupport_ssl_error.log"
    CustomLog "logs/apollosupport_ssl_access.log" combined
</VirtualHost>
