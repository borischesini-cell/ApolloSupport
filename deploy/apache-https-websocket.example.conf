# Ejemplo: ApolloSupport en HTTPS (443) con WebSocket (WSS).
# El error "WebSocket is closed before the connection is established" en Chrome
# casi siempre = el proxy NO está pasando el Upgrade a uvicorn.
#
# Requisitos en httpd.conf:
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#   LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
#   LoadModule rewrite_module modules/mod_rewrite.so
#   LoadModule ssl_module modules/mod_ssl.so
#
# Ajustar rutas de certificados y DocumentRoot.

<VirtualHost *:443>
    ServerName support.ultimate.net.ar
    DocumentRoot "C:/Apache24/htdocs/apollosupport"

    SSLEngine on
    SSLCertificateFile "C:/ruta/certificado.crt"
    SSLCertificateKeyFile "C:/ruta/certificado.key"
    # SSLCertificateChainFile "C:/ruta/chain.crt"   # si aplica

    <Directory "C:/Apache24/htdocs/apollosupport">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    # ── WebSocket: DEBE ir antes del ProxyPass HTTP de /api ─────────────
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/api/(.*)$ ws://127.0.0.1:8001/api/$1 [P,L,QSA]

    # HTTP API normal
    ProxyPass        /api  http://127.0.0.1:8001/api
    ProxyPassReverse /api  http://127.0.0.1:8001/api

    # Timeout largo para streams / WS largos (opcional)
    ProxyTimeout 600

    ErrorLog  "logs/apollosupport_ssl_error.log"
    CustomLog "logs/apollosupport_ssl_access.log" combined
</VirtualHost>
