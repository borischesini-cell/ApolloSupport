# coturn para ApolloSupport - canal rápido WebRTC
# Requiere: IP pública (o la IP que ven los técnicos/agentes) en external-ip.
# Generar credenciales:  turnadmin -a -u apollo -p <PASSWORD> -r apollo
#   (o con docker: docker exec apollo-coturn turnadmin -a -u apollo -p <PASSWORD> -r apollo)

listening-port=3478
tls-listening-port=5349

# Sin TLS interno (terminación TLS no usada; el SDP va cifrado por el WS de Support).
fingerprint
lt-cred-mech

realm=apollo

# IP que ven los peers (pública). Si la VM está detrás de NAT 1:1, poner "ip_privada/ip_publica".
# external-ip=PONER_IP_PUBLICA

# No usar system users, solo turnadmin
userdb=/var/lib/coturn/turndb

# Límites (canal rápido = 1 video ~1.5 Mbps por sesión)
max-bps=4194304
total-quota=100
stale-nonce

# Logs
log-file=stdout
min-port=49152
max-port=65535
